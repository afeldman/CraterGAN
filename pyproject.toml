[tool.poetry]
name = "cratergan"
version = "0.1.0"
description = "create crater data ustilizing a GAN"
authors = ["Anton Feldmann <anton.feldmann@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
torch = "^2.3.1"
